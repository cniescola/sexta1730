<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

<body>

    <header class="container-fluid p-4 card">
        <nav class="container">
            <ul class="nav d-flex justify-content-center">
                <li class="nav-item"><a href="#" class="nav-link">Home</a></li>

                <li class="nav-item"><a href="#" class="nav-link">About</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>
            </ul>
        </nav>
    </header>


    <main>

        <section class="container-fluid mt-4">
            <div class="container">
                <div class="row">
                    <div class="col-lg-8 card p-4">
                        <h3 class="h5 mb-5">Cadastro de produto</h3>

                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label">Digite o nome do produto</label>
                                <input type="text" class="form-control" name="nomeProd">
                            </div>
                            <div class="col b">
                                <label class="form-label">link do produto</label>
                                <input type="text" class="form-control" name="linkProd">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col">
                                <label class="form-label">Descrição do produto</label>
                                <textarea class="form-control" rows="9" name="descProd"></textarea>
                            </div>
                            <div class="col">
                                <div class="d-flex flex-column justify-content-between h-100">
                                    <div class="mb-3">
                                        <label class="form-label">Preço de Custo R$</label>
                                        <input type="text" class="form-control" name="precoCustProd">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">% acrecimo</label>
                                        <input type="number" class="form-control" name="porcentProd">
                                    </div>
                                    <div class="">
                                        <label class="form-label">Preço Produto</label>
                                        <input type="number" class="form-control" name="precoProd">
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>


                    <div class="col-lg-4">
                        <div class="d-flex flex-column justify-content-between h-100">
                            <div class="card mb-3 p-4">
                                <label class="form-label">Meta Tags</label>
                                <input type="text" class="form-control" name="metaProd">
                            </div>
                            <div class="card mb-3 p-4">
                                <label class="form-label">Parcelas</label>
                                <input type="number" max="12" class="form-control" name="divdProd">
                            </div>
                            <div class="card p-4">
                                <label class="form-label">Mensagem cliente</label>
                                <input type="text" class="form-control" name="smsProd">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="container p-4 mb-3">
                <button class="btn btn-success w-100" type="button" name="salvar" id="salvar">Salvar</button>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
