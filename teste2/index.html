<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <header>
        <div class="container-fluid p-4 card">
            <div class="container">
                <ul class="nav d-flex justify-content-center">
                    <li class="nav-item"><a href="#" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">About</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Link</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>
                </ul>
            </div>
        </div>
    </header>

    <section class="container-fluid mt-4">
        <div class="container">
            <div class="row">
                <div class="col-lg-7 card p-4">
                    <h3 class="h5 mb-5">Cadastro</h3>
                    <div class="row">
                        <div class="col">
                            <label class="form-label">Nome de usuario</label>
                            <input type="text" class="form-control" name="nome">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <label class="form-label">Senha</label>
                            <input type="password" class="form-control" name="senha">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <label class="form-label">Confirmar senha</label>
                            <input type="password" class="form-control" name="senhaConf">
                        </div>
                    </div>
                </div>

                <div class="col-lg-5 card p-4 d-flex justify-content-between">

                    <h3 class="h5 mb-5">Informações extras</h3>
                    <div class="row">
                        <div class="col">
                            <label class="form-label">Contato</label>
                            <input type="tel" placeholder="(12) 12345-6789" class="form-control" name="tel">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="emailCont">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col d-flex justify-content-center mt-5">
                            <button class="btn btn-success" name="cadastrar">Cadastrar</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <div class='container.fluid mt-5 d-flex justify-content-center align-items-center'>
        <div  class='container p-4 d-flex flex-column justify-content center bg-secondary-subtle mt-2 rounded-2 shadow'>
            <h1 id="lista" class="text-center mb-5">Contas Cadastradas</h1>
        </div>
    </div>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>


    <script type="text/javascript">

        $('[name = "cadastrar"]').click(function () {

            var nome = $('[name="nome"]').val()
            var email = $('[name="email"]').val()
            var senha = $('[name="senha"]').val()
            var senhaConf = $('[name="senhaConf"]').val()
            var tel = $('[name="tel"]').val()
            var emailCont = $('[name="emailCont"]').val()

            var dados = new FormData()

            dados.append("nome", nome)
            dados.append("email", email)
            dados.append("senha", senha)
            dados.append("senhaConf", senhaConf)
            dados.append("tel", tel)
            dados.append("emailCont", emailCont)

            $.ajax({
                url: "recebe.php",
                method: "POST",
                data: dados,
                processData: false,
                contentType: false,
                success: function (content) {
                    $('#lista').after(content)
                }
            })

        });




    </script>
</body>

</html>
