<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <header>
        <div class="container-fluid p-4 card">
            <div class="container">
                <ul class="nav d-flex justify-content-center">
                    <li class="nav-item"><a href="#" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">About</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Link</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>
                </ul>
            </div>
        </div>
    </header>

    <section class="container-fluid mt-4">
        <div class="container">
            <div class="row">
                <div class="col-lg-7 card p-4">
                    <h3 class="h5 mb-5">Cadastro</h3>
                    <div class="row">
                        <div class="col">
                            <label class="form-label">Nome de usuario</label>
                            <input type="text" class="form-control">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <label class="form-label">Senha</label>
                            <input type="password" class="form-control">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <label class="form-label">Confirmar senha</label>
                            <input type="password" class="form-control">
                        </div>
                    </div>
                </div>

                <div class="col-lg-5 card p-4 d-flex justify-content-between">

                    <h3 class="h5 mb-5">Informações extras</h3>
                    <div class="row">
                        <div class="col">
                            <label class="form-label">Contato</label>
                            <input type="tel" placeholder="(12) 12345-6789" class="form-control">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col d-flex justify-content-center mt-5">
                            <button class="btn btn-success">Cadastrar</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
